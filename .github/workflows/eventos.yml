# Actualiza data/agenda.json con la agenda pública de Turismo de Tenerife (webtenerife.com/agenda) y lo sube a main.
# Lunes y jueves de madrugada (hora de Canarias ≈ UTC), a mano desde Actions, o al cambiar el lector.
name: Actualizar eventos (agenda de Tenerife)

on:
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'herramientas/agenda_webtenerife.py'
      - '.github/workflows/eventos.yml'

permissions:
  contents: write

concurrency:
  group: datos-main
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Leer la agenda
        run: python3 herramientas/agenda_webtenerife.py

      - name: Subir si hay eventos nuevos o cambiados
        run: |
          # Solo cuenta si cambian los eventos, no la hora de «actualizado».
          if git diff --quiet -I '"actualizado"' data/agenda.json; then echo "Sin cambios en los eventos"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agenda.json
          git commit -m "Agenda: eventos actualizados desde webtenerife.com"
          git pull --rebase origin main
          git push origin HEAD:main
